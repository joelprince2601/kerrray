# KerrRay configuration: strong-field lensing experiment (PROJECT.md section 22).
# Schema: PROJECT.md section 34 plus docs/architecture.md section 7
# (src/kerrray/utils/config.py; docs/decisions.md D-004, D-009).
# Units: G = c = 1, lengths in units of the black-hole mass M (M = 1 here).
experiment:
  name: lensing
  description: >-
    Deflection angle, closest approach and orbital turns versus impact parameter
    for photons passing close to the black hole (Phase 7). The reference
    deflection relation is verified from the literature before use, never stored here.
  seed: 0
  output_dir: runs
  report_dir: reports
  parameters:
    # Impact-parameter scan in units of M, from the CLI example
    # "kerrray lens --impact-range 3,20" in PROJECT.md section 28; n_rays samples
    # are launched from launch_radius in the equatorial plane. The optional
    # accretion-disk sub-block "disk" (docs/architecture.md section 7) is absent
    # here, so its documented defaults (disk disabled) apply.
    lensing:
      impact_min: 3.0
      impact_max: 20.0
      n_rays: 40
      launch_radius: 1000.0

black_hole:
  mass: 1.0
  spin: 0.9

observer:
  radius: 1000.0
  inclination_deg: 90.0   # equatorial-plane lensing setup
  phi_deg: 0.0

integration:
  method: rk45
  rtol: 1e-9
  atol: 1e-11
  max_steps: 100000
  step_size: 0.01
  lambda_max: 10000.0

raytrace:
  resolution: 64
  fov: 12.0
  backend: numpy
  dtype: float64

termination:
  horizon_epsilon: 1e-6
  escape_radius: 1000.0
