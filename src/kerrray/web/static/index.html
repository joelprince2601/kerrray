<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KerrRay</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/desktop.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-logo" viewBox="0 0 32 32"><ellipse cx="16" cy="16" rx="14.5" ry="5" fill="none" stroke="#ff8a3d" stroke-width="1.8" transform="rotate(-18 16 16)"/><circle cx="16" cy="16" r="7.2" fill="#000" stroke="#ffb27a" stroke-width="1.1"/></symbol>
    <symbol id="i-shadow" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 2"/><circle cx="10.6" cy="10" r="4.4" fill="currentColor"/></symbol>
    <symbol id="i-geo" viewBox="0 0 20 20"><circle cx="10" cy="11" r="2.8" fill="currentColor"/><path d="M1.5 5c6 .5 11 1.5 11.6 5.3.6 3.6-3.8 4.8-6.2 2.4S9.5 7 18.5 5.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-sweep" viewBox="0 0 20 20"><path d="M2.5 2.5v15h15" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M4 5c4 1.5 8 4 12.5 10M4 15c4-1 8.5-4 12.5-10" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 10.3l2.8 2.8L14.2 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-anim" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3" fill="currentColor"/><path d="M1.5 6.5h5M1.5 10h4M1.5 13.5h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".7"/><path d="M13.5 5.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 20 20"><rect x="5" y="4" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="11.5" y="4" width="3.5" height="12" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-restart" viewBox="0 0 20 20"><path d="M4.5 10a5.5 5.5 0 1 0 1.8-4.1M4.5 3.5v3.2h3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-rec" viewBox="0 0 20 20"><circle cx="10" cy="10" r="4.5" fill="currentColor"/></symbol>
    <symbol id="i-info" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 9v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="6.2" r="1.1" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 20 20"><path d="M6 4l10 6-10 6z" fill="currentColor"/></symbol>
    <symbol id="i-zoom" viewBox="0 0 16 16"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 10l4.5 4.5" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-pan" viewBox="0 0 16 16"><path d="M8 1.5v13M1.5 8h13M8 1.5L6 3.5M8 1.5l2 2M8 14.5l-2-2M8 14.5l2-2M1.5 8l2-2M1.5 8l2 2M14.5 8l-2-2M14.5 8l-2 2" stroke="currentColor" stroke-width="1.3" fill="none"/></symbol>
    <symbol id="i-tip" viewBox="0 0 16 16"><path d="M3 2l9.5 5-4 1.2L7 12.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 16 16"><path d="M2.5 6.5V2.5h4M13.5 9.5v4h-4M2.5 9.5v4h4M13.5 6.5v-4h-4" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="i-save" viewBox="0 0 16 16"><path d="M8 2v8M4.5 7L8 10.5 11.5 7M2.5 13.5h11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="i-term" viewBox="0 0 16 16"><path d="M3 4.5l3.5 3.5L3 11.5M8 12h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="app">
  <header id="top">
    <div class="brand"><svg><use href="#i-logo"/></svg><span>KerrRay</span></div>
    <nav id="views" role="tablist">
      <button class="view active" data-view="shadow"><svg><use href="#i-shadow"/></svg>Shadow</button>
      <button class="view" data-view="geodesic"><svg><use href="#i-geo"/></svg>Geodesic</button>
      <button class="view" data-view="sweep"><svg><use href="#i-sweep"/></svg>Spin Sweep</button>
      <button class="view" data-view="animate"><svg><use href="#i-anim"/></svg>Animation</button>
      <button class="view" data-view="validation"><svg><use href="#i-check"/></svg>Validation</button>
      <span class="nav-sep"></span>
      <button class="view" data-view="about"><svg><use href="#i-info"/></svg>About</button>
    </nav>
    <div class="top-right">
      <div id="status"><span class="dot"></span><span id="status-text">Ready</span></div>
      <button id="console-toggle" class="icon-btn" title="Console ( ` )"><svg><use href="#i-term"/></svg></button>
      <button id="run" class="run" title="Run (Ctrl+Enter)"><svg><use href="#i-play"/></svg><span id="run-label">Trace shadow</span></button>
    </div>
  </header>

  <main id="main">
    <aside id="controls"></aside>

    <section id="stage">
      <div id="stagebar">
        <div id="chips"></div>
        <div class="tools">
          <button data-mode="tip" class="on" title="Inspect"><svg><use href="#i-tip"/></svg></button>
          <button data-mode="zoom" title="Box zoom (scroll also zooms)"><svg><use href="#i-zoom"/></svg></button>
          <button data-mode="pan" title="Pan"><svg><use href="#i-pan"/></svg></button>
          <button data-act="restore" title="Reset view"><svg><use href="#i-home"/></svg></button>
          <button data-act="save" title="Save PNG"><svg><use href="#i-save"/></svg></button>
        </div>
      </div>
      <div id="canvas-host">
        <div id="empty"><div class="spinner"></div><div id="empty-text">Starting engine...</div></div>
      </div>
      <div id="readout"></div>
    </section>

    <aside id="results">
      <section class="card-group"><h3 id="results-title">Results</h3><div id="metrics"></div></section>
      <section class="card-group"><h3>Black hole <span class="sub" id="bh-spin"></span></h3><div id="derived"></div></section>
    </aside>
  </main>

  <section id="console" class="collapsed">
    <div id="con-out"></div>
    <div id="con-line"><span>&gt;&gt;</span><input id="con-in" autocomplete="off" spellcheck="false" placeholder="shadow(0.9, 60, 64)   geodesic(0.9, 3)   spin = 0.99   help"></div>
  </section>
</div>
<script src="/static/plot.js"></script>
<script src="/static/anim.js"></script>
<script src="/static/about.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
