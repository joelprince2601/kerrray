# KerrRay configuration: black-hole shadow reconstruction (PROJECT.md section 17).
# Schema: PROJECT.md section 34 plus docs/architecture.md section 7
# (src/kerrray/utils/config.py; docs/decisions.md D-004, D-009).
# Units: G = c = 1, lengths in units of the black-hole mass M (M = 1 here).
experiment:
  name: shadow
  description: >-
    Shadow generated from photon capture/escape classification (Phase 5), with
    the spin sweep EXP-003, the inclination sweep EXP-004 and the resolution
    convergence EXP-008 of PROJECT.md section 37.
  seed: 0
  output_dir: runs
  report_dir: reports
  parameters:
    # EXP-003 spin sweep (PROJECT.md section 37).
    spin_sweep:
      spins: [0.0, 0.25, 0.5, 0.75, 0.9, 0.99]
    # EXP-004 inclination sweep in degrees (PROJECT.md sections 15 and 37). 0 deg is
    # moved to 1e-3 deg by the schema because the ZAMO tetrad is singular on the
    # axis (docs/decisions.md, D-008).
    inclination_sweep:
      inclinations_deg: [0, 30, 45, 60, 75, 90]
    # EXP-008 and sections 18 to 20: resolutions (pixels per side), adaptive
    # tolerances and fixed step sizes (units of M). 1024 is opt-in through a CLI
    # override; the driver logs what it skipped.
    convergence:
      resolutions: [64, 128, 256, 512]
      tolerances: [1.0e-6, 1.0e-8, 1.0e-10, 1.0e-12]
      step_sizes: [0.1, 0.01, 0.001, 0.0001]

black_hole:
  mass: 1.0
  spin: 0.9

observer:
  radius: 1000.0
  inclination_deg: 60.0
  phi_deg: 0.0

integration:
  method: rk45
  rtol: 1e-9
  atol: 1e-11
  max_steps: 100000
  step_size: 0.01
  lambda_max: 10000.0

raytrace:
  resolution: 64          # development default; EXP-008 resolutions come from
  fov: 12.0               # experiment.parameters.convergence.resolutions
  backend: numpy
  dtype: float64

termination:
  horizon_epsilon: 1e-6
  escape_radius: 1000.0
